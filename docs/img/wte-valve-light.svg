<text x="24.0" y="276.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">Testers' timing-kit reports, each build against AMD's in the same report, median per device. The Steam Machine's reports predate this release's</text>
<text x="24.0" y="290.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">lossy and Lite builds: only exact is shown, against AMD's FSR 4.1.2 RX 7000 model as AMD's driver ships it. Other sizes: the table below.</text>
<text x="24.0" y="304.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">The two panels have different scales: 0 to 20% on the left, 0 to 15% on the right.</text>
