<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354" role="img" aria-label="Valve hardware: Steam Deck and Steam Machine: how much less time FSR 4 takes per frame with this project's builds than with AMD's own, moving scene, Balanced. Steam Deck OLED (SteamOS, 800p, 23 reports): exact 3%, lossy 13%, AMD's Lite itself 25% less time than AMD's FSR 4.1.2; 4.1.2l-exact 5%, 4.1.2l-lossy 12% less than AMD's Lite. Steam Deck LCD (Windows, 800p, 7 reports): exact 2% more, lossy no report, AMD's Lite itself 36% less time than AMD's FSR 4.1.2; 4.1.2l-exact 13%, 4.1.2l-lossy no report less than AMD's Lite. Steam Machine (SteamOS, 1440p, 3 reports): exact 5%, lossy no report, AMD's Lite itself no report less time than AMD's FSR 4.1.2; 4.1.2l-exact no report, 4.1.2l-lossy no report less than AMD's Lite.">
