<svg xmlns="http://www.w3.org/2000/svg" width="760" height="686" viewBox="0 0 760 686" role="img" aria-label="A diverging bar chart comparing AMD's FSR 4.1.2 Lite with FSR 4.1.1 on the main measures of this page. The center line is FSR 4.1.1; a bar to the right means Lite has less error, change per frame or time (better), to the left more (worse), on a scale from four times less to four times more. Time per upscale call, 4K: FSR 4.1.2 Lite 2.00 ms, FSR 4.1.1 4.86 ms (59% less error, change or time). Still picture: FSR 4.1.2 Lite 43.92 dB, FSR 4.1.1 44.33 dB (5% more error, change or time). Moving background: FSR 4.1.2 Lite 50.15 dB, FSR 4.1.1 50.82 dB (8% more error, change or time). Thin railing in motion: FSR 4.1.2 Lite 40.95 dB, FSR 4.1.1 41.61 dB (8% more error, change or time). Just uncovered, camera panning: FSR 4.1.2 Lite 37.30 dB, FSR 4.1.1 33.21 dB (38% less error, change or time). Just uncovered, camera still: FSR 4.1.2 Lite 29.75 dB, FSR 4.1.1 32.62 dB (39% more error, change or time). Swaying leaves, three speeds: error: FSR 4.1.2 Lite 10.0, FSR 4.1.1 11.0 (9% less error, change or time). Large particles: error: FSR 4.1.2 Lite 0.71, FSR 4.1.1 0.66 (8% more error, change or time). Tiny fast sparks: share shown: FSR 4.1.2 Lite 76%, FSR 4.1.1 83% (9% less shown). Old image beside moving things, 7 scenes: FSR 4.1.2 Lite 2.52, FSR 4.1.1 1.92 (31% more error, change or time). Thin bars fixed on screen, four pans: FSR 4.1.2 Lite 1.28, FSR 4.1.1 0.82 (56% more error, change or time). Still picture: change per frame: FSR 4.1.2 Lite 0.029, FSR 4.1.1 0.037 (22% less error, change or time). Moving background: change per frame: FSR 4.1.2 Lite 0.100, FSR 4.1.1 0.080 (25% more error, change or time). Thin wire, slow pan: change per frame: FSR 4.1.2 Lite 9.8, FSR 4.1.1 7.2 (36% more error, change or time). Thin wire, slow pan: brightness error: FSR 4.1.2 Lite 42 of 255, FSR 4.1.1 10 of 255 (4.0x as much error, change or time).">
