<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-label="What to expect at 4K on a Radeon RX 7800 XT in Shadow of the Tomb Raider, FSR 4.1.1 Balanced. AMD's shaders: 4.16 milliseconds of upscaling per frame, 97 frames per second, the reference. Exact DLL: 2.99 milliseconds of upscaling per frame, 109 frames per second, same picture, byte for byte. Lossy DLL: 2.15 milliseconds of upscaling per frame, 120 frames per second, very close picture, opt-in. Lower output resolutions gain less.">
