<text x="24.0" y="304.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Shadow of the Tomb Raider benchmark, 4K output, Balanced, Radeon RX 7800 XT, tested on Linux (Proton).</text>
<text x="24.0" y="320.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Other resolutions, other cards and Windows give other numbers.</text>
