<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-label="What to expect at 4K on a Radeon RX 7800 XT in Shadow of the Tomb Raider, FSR 4.1.1 Balanced, tested on Linux (Proton). AMD's shaders: 4.16 milliseconds of upscaling per frame, 97 frames per second, the reference. Exact DLL: 2.96 milliseconds of upscaling per frame, 109 frames per second, same picture, byte for byte. Lossy DLL: 2.06 milliseconds of upscaling per frame, 122 frames per second, very close picture, opt-in. Other resolutions, other cards and Windows give other numbers.">
<rect width="760" height="334" rx="8" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#0b0b0b">What to expect at 4K</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#52514e">Time FSR 4.1.1 takes per frame (shorter is better), and the frame rate that goes with it</text>
<text x="736.0" y="84.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#898781">frame rate</text>
