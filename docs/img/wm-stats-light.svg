<text x="460" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e">free space</text>
<text x="24" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Total: 3.5 TB, backups included (1.9 TB of it).</text>
<text x="24" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#52514e">974,816 files, not counting the backup copies.</text>
<text x="24" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#52514e">Grew by about 1.1 TB in the past 7 days (698 GB of it backups).</text>
<text x="24" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">WORK DONE</text>
<text x="470" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#898781">Past 7 days</text>
<text x="736" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#898781">Since Oct 16</text>
<line x1="24" y1="400" x2="736" y2="400" stroke="#c9c8c0"/>
<text x="24" y="421" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Processor time</text>
<text x="470" y="421" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">101 h</text>
<text x="736" y="421" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">510 h</text>
<line x1="24" y1="432" x2="736" y2="432" stroke="#c9c8c0"/>
<text x="24" y="453" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Graphics card time</text>
<text x="470" y="453" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">46 h</text>
<text x="736" y="453" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">218 h</text>
<line x1="24" y1="464" x2="736" y2="464" stroke="#c9c8c0"/>
<text x="24" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Data read</text>
<text x="470" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">51.7 TB (31.0 TB from drives)</text>
<text x="736" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">292.3 TB (132.6 TB from drives)</text>
<line x1="24" y1="496" x2="736" y2="496" stroke="#c9c8c0"/>
<text x="24" y="517" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Data written</text>
<text x="470" y="517" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">1.5 TB (217 GB to drives)</text>
<text x="736" y="517" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">6.9 TB (1.6 TB to drives)</text>
<text x="24" y="542" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Work is counted from Oct 16, 2026, when the job recorder started (the project began Oct 1); jobs still running are counted when they end.</text>
<text x="24" y="557" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Graphics card time is how long jobs held the card: an upper bound. Data read includes data read again from memory; "from drives" reached the drives.</text>
<text x="24" y="572" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Growth: the backed-up project files a week apart, new files on the USB drives, and what the nightly backups copied.</text>
</svg>
