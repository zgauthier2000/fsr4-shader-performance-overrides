<svg xmlns="http://www.w3.org/2000/svg" width="760" height="587" viewBox="0 0 760 587" role="img" aria-label="What the project uses, measured 2026-11-04: disk space Main SSD 699 GB of 1.0 TB; Second SSD (also games) 379 GB of 983 GB; USB hard drive 2.0 TB of 7.9 TB; total 3.1 TB including 1.5 TB of backups, 953,764 files not counting backup copies; grew about 666 GB in the past 7 days. Past 7 days: 78 processor hours, 34 graphics card hours, 46.4 TB read, 1.5 TB written. Since Oct 16: 456 processor hours, 192 graphics card hours, 266.7 TB read, 6.5 TB written.">
<rect width="760" height="587" rx="8" fill="#fcfcfb"/>
<text x="24" y="32" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">What the project uses</text>
<text x="24" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#52514e">Measured 2026-11-04 on the author's PC.</text>
<text x="24" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">DISK SPACE</text>
<circle cx="140" cy="154" r="58" fill="#fcfcfb" stroke="#c9c8c0" stroke-width="1.5"/>
