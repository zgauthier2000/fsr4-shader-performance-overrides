<text x="140" y="253" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#52514e">699 GB of 1.0 TB (69%)</text>
<circle cx="380" cy="154" r="58" fill="#fcfcfb" stroke="#c9c8c0" stroke-width="1.5"/>
<path d="M380,154 L418.2,197.6 A58,58 0 0 1 328.3,127.7 Z" fill="#f1f0ec" stroke="#fcfcfb" stroke-width="2"/>
<path d="M380,154 L380.0,96.0 A58,58 0 0 1 418.2,197.6 Z" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="380" cy="154" r="58" fill="none" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="380" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Second SSD (also games)</text>
<text x="380" y="253" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#52514e">379 GB of 983 GB (39%)</text>
<circle cx="620" cy="154" r="58" fill="#fcfcfb" stroke="#c9c8c0" stroke-width="1.5"/>
<path d="M620,154 L677.9,156.9 A58,58 0 0 1 607.4,210.6 Z" fill="#f1f0ec" stroke="#fcfcfb" stroke-width="2"/>
<path d="M620,154 L620.0,96.0 A58,58 0 0 1 677.9,156.9 Z" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="620" cy="154" r="58" fill="none" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="620" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">USB hard drive</text>
<text x="620" y="253" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#52514e">2.0 TB of 7.9 TB (26%)</text>
<rect x="220" y="270" width="14" height="10" fill="#2a78d6"/>
<text x="240" y="279" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e">this project</text>
<rect x="330" y="270" width="14" height="10" fill="#f1f0ec" stroke="#c9c8c0"/>
<text x="350" y="279" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e">other files</text>
<rect x="440" y="270" width="14" height="10" fill="#fcfcfb" stroke="#c9c8c0"/>
<text x="460" y="279" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e">free space</text>
<text x="24" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Total: 3.1 TB, backups included (1.5 TB of it).</text>
<text x="24" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#52514e">953,764 files, not counting the backup copies.</text>
<text x="24" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#52514e">Grew by about 666 GB in the past 7 days (419 GB of it backups).</text>
<text x="24" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">WORK DONE</text>
<text x="470" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#898781">Past 7 days</text>
<text x="736" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#898781">Since Oct 16</text>
<line x1="24" y1="396" x2="736" y2="396" stroke="#c9c8c0"/>
<text x="24" y="417" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Processor time</text>
<text x="470" y="417" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">78 h</text>
<text x="736" y="417" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">456 h</text>
<line x1="24" y1="428" x2="736" y2="428" stroke="#c9c8c0"/>
<text x="24" y="449" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Graphics card time</text>
<text x="470" y="449" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">34 h</text>
<text x="736" y="449" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">192 h</text>
<line x1="24" y1="460" x2="736" y2="460" stroke="#c9c8c0"/>
<text x="24" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Data read</text>
<text x="470" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">46.4 TB (26.1 TB from drives)</text>
<text x="736" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">266.7 TB (114.7 TB from drives)</text>
<line x1="24" y1="492" x2="736" y2="492" stroke="#c9c8c0"/>
<text x="24" y="513" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Data written</text>
<text x="470" y="513" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">1.5 TB (248 GB to drives)</text>
<text x="736" y="513" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#0b0b0b">6.5 TB (1.5 TB to drives)</text>
<text x="24" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Work is counted from Oct 16, 2026, when the job recorder started (the project began Oct 1); jobs still running are counted when they end.</text>
<text x="24" y="553" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Graphics card time is how long jobs held the card: an upper bound. Data read includes data read again from memory; "from drives" reached the drives.</text>
<text x="24" y="568" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Growth: the backed-up project files a week apart, new files on the USB drive, and what the nightly backups copied.</text>
</svg>
