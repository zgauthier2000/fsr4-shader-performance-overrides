<svg xmlns="http://www.w3.org/2000/svg" width="760" height="506" viewBox="0 0 760 506" role="img" aria-label="How lossy2 differs from the lossy DLL inside. Both run the same steps: the prepass, FSR 4's neural network of twelve layers, and the last shader, with the same frame skip: the network runs on every other frame, and on the frames in between the last shader moves its last result along with the picture. In lossy the network's layers carry AMD's weights, with layers 1 and 10 lightly folded. In lossy2 layers 1, 2, 4, 5, 10 and 12 carry new weights, trained from lossy's weights so that lossy's whole frame loop, skipped frames included, comes closer to AMD's picture; the other six layers, the prepass, the last shader and Ultra Performance are lossy's. Same shapes and sizes, so the same speed. The training tools are those of Durandal, the project's unreleased smaller network.">
<rect x="0.0" y="0.0" width="760.0" height="506.0" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">What lossy2 changes inside the lossy DLL</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">The same steps and the same frame skip. Only the numbers in six of the network's twelve layers differ.</text>
