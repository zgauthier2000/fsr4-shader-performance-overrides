<svg xmlns="http://www.w3.org/2000/svg" width="760" height="578" viewBox="0 0 760 578" role="img" aria-label="Linux (Proton): how much less time FSR 4 takes per frame with this project's builds than with AMD's own, moving scene, Balanced. Radeon RX 7800 XT (1440p): exact 34%, lossy 51%, less time than AMD's FSR 4.1.2; 4.1.2l-exact 11%, 4.1.2l-lossy 21% less than AMD's Lite. RX 6800 to 6900 XT (1440p, 13 reports): exact 4%, lossy no report, less time than AMD's FSR 4.1.2; 4.1.2l-exact 9%, 4.1.2l-lossy no report less than AMD's Lite. Radeon RX 6700 XT (1440p, 28 reports): exact 4%, lossy 28%, less time than AMD's FSR 4.1.2; 4.1.2l-exact 7%, 4.1.2l-lossy 12% less than AMD's Lite. Radeon RX 6650 XT (1440p, 1 report): exact 6%, lossy no report, less time than AMD's FSR 4.1.2; 4.1.2l-exact 8%, 4.1.2l-lossy no report less than AMD's Lite. Radeon RX 6600 XT (1440p, 19 reports): exact 7%, lossy no report, less time than AMD's FSR 4.1.2; 4.1.2l-exact 8%, 4.1.2l-lossy no report less than AMD's Lite. Radeon 780M (1080p, 5 reports): exact 4%, lossy 27%, less time than AMD's FSR 4.1.2; 4.1.2l-exact 10%, 4.1.2l-lossy 12% less than AMD's Lite. Ryzen Z1 Extreme (1080p, 1 report): exact 5%, lossy 29%, less time than AMD's FSR 4.1.2; 4.1.2l-exact 11%, 4.1.2l-lossy 18% less than AMD's Lite.">
