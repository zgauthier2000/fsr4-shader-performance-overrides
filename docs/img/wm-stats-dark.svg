<circle cx="649" cy="148" r="52" fill="none" stroke="#45453f" stroke-width="1.5"/>
<text x="649" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffffff">USB hard drive</text>
<text x="649" y="241" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#c3c2b7">2.2 TB of 7.9 TB (27%)</text>
<rect x="220" y="274" width="14" height="10" fill="#3987e5"/>
<text x="240" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#c3c2b7">this project</text>
<rect x="330" y="274" width="14" height="10" fill="#262624" stroke="#45453f"/>
<text x="350" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#c3c2b7">other files</text>
<rect x="440" y="274" width="14" height="10" fill="#1a1a19" stroke="#45453f"/>
<text x="460" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#c3c2b7">free space</text>
<text x="24" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">Total: 3.5 TB, backups included (1.9 TB of it).</text>
<text x="24" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#c3c2b7">974,816 files, not counting the backup copies.</text>
<text x="24" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#c3c2b7">Grew by about 1.1 TB in the past 7 days (698 GB of it backups).</text>
<text x="24" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#c3c2b7">WORK DONE</text>
<text x="470" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#898781">Past 7 days</text>
<text x="736" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#898781">Since Oct 16</text>
<line x1="24" y1="400" x2="736" y2="400" stroke="#45453f"/>
<text x="24" y="421" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">Processor time</text>
<text x="470" y="421" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">101 h</text>
<text x="736" y="421" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">510 h</text>
<line x1="24" y1="432" x2="736" y2="432" stroke="#45453f"/>
<text x="24" y="453" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">Graphics card time</text>
<text x="470" y="453" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">46 h</text>
<text x="736" y="453" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">218 h</text>
<line x1="24" y1="464" x2="736" y2="464" stroke="#45453f"/>
<text x="24" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">Data read</text>
<text x="470" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">51.7 TB (31.0 TB from drives)</text>
<text x="736" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">292.3 TB (132.6 TB from drives)</text>
<line x1="24" y1="496" x2="736" y2="496" stroke="#45453f"/>
<text x="24" y="517" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">Data written</text>
<text x="470" y="517" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">1.5 TB (217 GB to drives)</text>
<text x="736" y="517" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">6.9 TB (1.6 TB to drives)</text>
<text x="24" y="542" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Work is counted from Oct 16, 2026, when the job recorder started (the project began Oct 1); jobs still running are counted when they end.</text>
<text x="24" y="557" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Graphics card time is how long jobs held the card: an upper bound. Data read includes data read again from memory; "from drives" reached the drives.</text>
<text x="24" y="572" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#898781">Growth: the backed-up project files a week apart, new files on the USB drives, and what the nightly backups copied.</text>
</svg>
