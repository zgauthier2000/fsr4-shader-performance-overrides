<text x="736" y="485" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#ffffff">343.0 TB (166.4 TB from drives)</text>
<line x1="24" y1="496" x2="736" y2="496" stroke="#45453f"/>
