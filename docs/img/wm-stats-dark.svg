<svg xmlns="http://www.w3.org/2000/svg" width="760" height="591" viewBox="0 0 760 591" role="img" aria-label="What the project uses, measured 2026-11-06: disk space Main NVMe drive 616 GB of 1.0 TB; Second NVMe drive (also games) 339 GB of 983 GB; USB M.2 SSD 358 GB of 503 GB; USB hard drive 2.2 TB of 7.9 TB; total 3.5 TB including 1.9 TB of backups, 974,816 files not counting backup copies; grew about 1.1 TB in the past 7 days. Past 7 days: 101 processor hours, 46 graphics card hours, 51.7 TB read, 1.5 TB written. Since Oct 16: 510 processor hours, 218 graphics card hours, 292.3 TB read, 6.9 TB written.">
<rect width="760" height="591" rx="8" fill="#1a1a19"/>
<text x="24" y="32" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#ffffff">What the project uses</text>
<text x="24" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">Measured 2026-11-06 on the author's PC.</text>
<text x="24" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#c3c2b7">DISK SPACE</text>
