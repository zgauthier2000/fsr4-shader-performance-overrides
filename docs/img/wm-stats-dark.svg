<text x="112" y="241" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#c3c2b7">616 GB of 1.0 TB (61%)</text>
<circle cx="291" cy="148" r="52" fill="#1a1a19" stroke="#45453f" stroke-width="1.5"/>
