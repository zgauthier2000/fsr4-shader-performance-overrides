<circle cx="291" cy="148" r="52" fill="none" stroke="#45453f" stroke-width="1.5"/>
<text x="291" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffffff">Second NVMe drive</text>
<text x="291" y="241" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#c3c2b7">339 GB of 983 GB (34%)</text>
<text x="291" y="257" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#898781">also games</text>
<circle cx="470" cy="148" r="52" fill="#1a1a19" stroke="#45453f" stroke-width="1.5"/>
<path d="M470,148 L419.6,160.6 A52,52 0 0 1 419.5,160.6 Z" fill="#262624" stroke="#1a1a19" stroke-width="2"/>
<path d="M470,148 L470.0,96.0 A52,52 0 1 1 419.6,160.6 Z" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="470" cy="148" r="52" fill="none" stroke="#45453f" stroke-width="1.5"/>
<text x="470" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffffff">USB M.2 SSD</text>
<text x="470" y="241" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#c3c2b7">358 GB of 503 GB (71%)</text>
<circle cx="649" cy="148" r="52" fill="#1a1a19" stroke="#45453f" stroke-width="1.5"/>
<path d="M649,148 L700.4,155.6 A52,52 0 0 1 616.2,188.4 Z" fill="#262624" stroke="#1a1a19" stroke-width="2"/>
