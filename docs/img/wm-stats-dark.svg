<svg xmlns="http://www.w3.org/2000/svg" width="760" height="606" viewBox="0 0 760 606" role="img" aria-label="What the project uses, measured 2026-11-11: disk space Main NVMe drive 334 GB of 1.0 TB; Second NVMe drive (also games) 313 GB of 983 GB; USB M.2 SSD 387 GB of 503 GB; USB NVMe drive (new) 395 GB of 1.0 TB; USB hard drive 3.0 TB of 7.9 TB; total 4.4 TB including 2.7 TB of backups, 1,086,973 files not counting backup copies; grew about 2.0 TB in the past 7 days. Past 7 days: 147 processor hours, 74 graphics card hours, 76.4 TB read, 1.5 TB written. Since Oct 16: 603 processor hours, 266 graphics card hours, 343.0 TB read, 7.9 TB written.">
