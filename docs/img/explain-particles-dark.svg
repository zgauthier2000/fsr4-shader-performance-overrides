<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-label="A spark that the game draws without motion information, over four frames. As it should look and with AMD's shaders, it moves a step every frame. In the previous lossy release it stayed where it was on every other frame, so it moved at half the frame rate, or showed dimmed. In this release it moves every frame again.">
<rect x="0.0" y="0.0" width="760.0" height="334.0" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">A spark over four frames</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">Games draw sparks and embers without telling FSR that they move. On skipped frames the old lossy DLL left them behind.</text>
<text x="256.0" y="86.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">frame 1</text>
<text x="392.0" y="86.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">frame 2  (skipped)</text>
<text x="528.0" y="86.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">frame 3</text>
<text x="664.0" y="86.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">frame 4  (skipped)</text>
<text x="24.0" y="122.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">As it should look</text>
<text x="24.0" y="140.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#c3c2b7">(and with AMD's shaders)</text>
<rect x="200.0" y="98.0" width="112.0" height="54.0" rx="4" fill="#0c0c0c" stroke="#2c2c2a" stroke-width="1.5"/>
<circle cx="220" cy="125" r="9" fill="#f2c56a" opacity="0.35"/><circle cx="220" cy="125" r="4.5" fill="#ffe4a8" opacity="1.00"/>
