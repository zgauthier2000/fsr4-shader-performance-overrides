<text x="24.0" y="304.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Dashed circle: where the spark really is. Measured on tiny fast sparks: 16% of their brightness was shown on</text>
<text x="24.0" y="320.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">skipped frames before, 77% now (AMD's shaders: 83%).</text>
