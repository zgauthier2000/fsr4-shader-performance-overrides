<circle cx="540" cy="125" r="9" fill="#f2c56a" opacity="0.35"/><circle cx="540" cy="125" r="4.5" fill="#ffe4a8" opacity="1.00"/>
<rect x="608.0" y="98.0" width="112.0" height="54.0" rx="4" fill="#0c0c0c" stroke="#2c2c2a" stroke-width="1.5"/>
<circle cx="700" cy="125" r="9" fill="#f2c56a" opacity="0.35"/><circle cx="700" cy="125" r="4.5" fill="#ffe4a8" opacity="1.00"/>
<text x="24.0" y="188.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">Previous lossy release</text>
<text x="24.0" y="206.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#c3c2b7">stuck on skipped frames</text>
