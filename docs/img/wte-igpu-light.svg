<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Built-in graphics on Windows at 1080p: how much less time FSR 4 takes per frame with this project's builds than with AMD's own, moving scene, Balanced. Radeon 890M (1080p, 2 reports): exact 12%, lossy no report, AMD's Lite itself 44% less time than AMD's FSR 4.1.2; 4.1.2l-exact 16%, 4.1.2l-lossy no report less than AMD's Lite. Radeon 880M (1080p, 2 reports): exact 9%, lossy 29%, AMD's Lite itself 40% less time than AMD's FSR 4.1.2; 4.1.2l-exact 11%, 4.1.2l-lossy 10% less than AMD's Lite. Radeon 780M (1080p, 3 reports): exact 5%, lossy 27%, AMD's Lite itself 38% less time than AMD's FSR 4.1.2; 4.1.2l-exact 4%, 4.1.2l-lossy 9% less than AMD's Lite.">
