<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="Two radar charts with nine spokes each. Left: this release's lossy DLL, with the previous release's as a dashed outline. Right: AMD's FSR 4.1.1, with this release's lossy DLL as a dashed outline. The spokes have the scale of the upscaler comparison's chart: the outer ring is the best of the five upscalers compared there (FSR 4.1.1, the lossy DLL, FSR 3.1, HelixSR, XeSS), and for film grain the best of these three. A larger shape is better. Still picture: accuracy (dB): FSR 4.1.1 44.33 dB, the lossy DLL of dll-2026-10-12 44.26 dB, the lossy DLL of dll-2026-10-12.2 44.26 dB. Moving background: accuracy (dB): FSR 4.1.1 49.27 dB, the lossy DLL of dll-2026-10-12 49.00 dB, the lossy DLL of dll-2026-10-12.2 48.98 dB. Areas a moving object has just uncovered: accuracy (dB): FSR 4.1.1 34.48 dB, the lossy DLL of dll-2026-10-12 36.53 dB, the lossy DLL of dll-2026-10-12.2 36.45 dB. Tiny fast sparks: share of their brightness shown (%): FSR 4.1.1 83%, the lossy DLL of dll-2026-10-12 74%, the lossy DLL of dll-2026-10-12.2 74%. Leaves swaying without motion vectors, mean of three sway speeds: error (of 255): FSR 4.1.1 11.0, the lossy DLL of dll-2026-10-12 14.6, the lossy DLL of dll-2026-10-12.2 14.5. Still picture with grain of 6 of 255: change per frame (of 255): FSR 4.1.1 0.785, the lossy DLL of dll-2026-10-12 0.460, the lossy DLL of dll-2026-10-12.2 0.330. Thin wire under a slow pan: change per frame (of 255): FSR 4.1.1 7.2, the lossy DLL of dll-2026-10-12 10.3, the lossy DLL of dll-2026-10-12.2 11.0. Still picture: change per frame (of 255): FSR 4.1.1 0.037, the lossy DLL of dll-2026-10-12 0.024, the lossy DLL of dll-2026-10-12.2 0.024. Time per upscale call at 3840x2160 (ms): FSR 4.1.1 4.76 ms, the lossy DLL of dll-2026-10-12 2.36 ms, the lossy DLL of dll-2026-10-12.2 2.22 ms.">
