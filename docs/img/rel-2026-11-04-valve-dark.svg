<text x="24.0" y="567.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">colored: the gray bar moved by the median same-report gain (the subtitle).</text>
<text x="24.0" y="582.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">Steam Deck: 2 reports (an OLED under Linux, an LCD under Windows; 4.1.2l-exact: the LCD only), 800p is its screen. Steam Machine: 1 report (Linux).</text>
<text x="24.0" y="597.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">Previous release = the build in each device's archive: Steam Deck = the older built-in graphics archive, Steam Machine = the RX 7000 archive.</text>
<text x="24.0" y="612.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#898781">800p and 1440p: the kit's AMD Lite reference ran one pass on a whole size class (AMD's own Lite does not): its time less that waste, from the same reports.</text>
