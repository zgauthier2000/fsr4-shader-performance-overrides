<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="The path of an improvement: idea, training on one RX 7800 XT, testing here on Linux, the timing kit on testers&#x27; PCs, release; kit results lead to the next change. Training is limited by one GPU with 16 GB, one run at a time at about an hour per run, 30 GB of system memory and several runs per setting; more GPU or system memory or a faster GPU would help. Testing here is limited to Linux and one card, with data on one slow USB drive; a Windows PC with Radeon, an RX 6000 card or a bigger, faster drive would help. The kit is limited to the cards people report and needs a new kit per experiment; your report helps.">
<rect width="760" height="360" rx="8" fill="#fcfcfb"/>
<text x="24" y="32" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">How an improvement gets to you, and what limits each step</text>
<rect x="24" y="74" width="128" height="78" rx="8" fill="#f1f0ec" stroke="#c9c8c0"/>
<text x="88" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Idea</text>
<text x="88" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">more speed or a</text>
<text x="88" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">better picture</text>
<line x1="152" y1="113" x2="163" y2="113" stroke="#898781" stroke-width="1.5"/><polygon points="170,113 163,110 163,116" fill="#898781"/>
<rect x="170" y="74" width="128" height="78" rx="8" fill="#f1f0ec" stroke="#c9c8c0"/>
<text x="234" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Train</text>
<text x="234" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">network runs on</text>
<text x="234" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">one RX 7800 XT</text>
<line x1="298" y1="113" x2="309" y2="113" stroke="#898781" stroke-width="1.5"/><polygon points="316,113 309,110 309,116" fill="#898781"/>
<rect x="316" y="74" width="128" height="78" rx="8" fill="#f1f0ec" stroke="#c9c8c0"/>
<text x="380" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Test here</text>
<text x="380" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">Linux only, on</text>
<text x="380" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">the same card</text>
<line x1="444" y1="113" x2="455" y2="113" stroke="#898781" stroke-width="1.5"/><polygon points="462,113 455,110 455,116" fill="#898781"/>
<rect x="462" y="74" width="128" height="78" rx="8" fill="#e3eefb" stroke="#2a78d6"/>
<text x="526" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Timing kit</text>
<text x="526" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">your PC, your</text>
<text x="526" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">Windows or Linux</text>
<line x1="590" y1="113" x2="601" y2="113" stroke="#898781" stroke-width="1.5"/><polygon points="608,113 601,110 601,116" fill="#898781"/>
<rect x="608" y="74" width="128" height="78" rx="8" fill="#f1f0ec" stroke="#c9c8c0"/>
<text x="672" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Release</text>
<text x="672" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">if the numbers</text>
<text x="672" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">hold up</text>
<polyline points="526,74 526,64 88,64" fill="none" stroke="#898781" stroke-width="1.5"/>
<line x1="88" y1="64" x2="88" y2="67" stroke="#898781" stroke-width="1.5"/><polygon points="88,74 85,67 91,67" fill="#898781"/>
<text x="307" y="59" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#898781">results point to the next change</text>
<polyline points="234,152 234,172 138,172 138,186" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="24" y="186" width="228" height="158" rx="8" fill="#fdeae2" stroke="#eb6834"/>
<text x="36" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">LIMITED BY</text>
<text x="36" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">One GPU with 16 GB: one run at a time,</text>
<text x="36" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">about an hour per run</text>
<text x="36" y="256" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">30 GB of system memory</text>
<text x="36" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">Each setting needs several runs</text>
<text x="36" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">WOULD HELP</text>
<text x="36" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0b0b">More GPU memory, a faster GPU,</text>
<text x="36" y="325" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0b0b">more system memory</text>
<polyline points="380,152 380,172 380,172 380,186" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="266" y="186" width="228" height="158" rx="8" fill="#fdeae2" stroke="#eb6834"/>
<text x="278" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">LIMITED BY</text>
<text x="278" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">Linux and one card: no Windows or</text>
<text x="278" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">RX 6000 timing here</text>
<text x="278" y="256" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">Clips and data on one slow USB drive</text>
<text x="278" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">WOULD HELP</text>
<text x="278" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0b0b">A Windows PC with Radeon, an</text>
<text x="278" y="325" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0b0b">RX 6000 card, a bigger, faster drive</text>
<polyline points="526,152 526,172 622,172 622,186" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="508" y="186" width="228" height="158" rx="8" fill="#e3eefb" stroke="#2a78d6"/>
<text x="520" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">LIMITED BY</text>
<text x="520" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">Only the cards people own and report</text>
<text x="520" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">Each experiment needs a new kit,</text>
<text x="520" y="256" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#0b0b0b">then time for reports to arrive</text>
<text x="520" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#52514e">WOULD HELP</text>
<text x="520" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Your timing kit report,</text>
<text x="520" y="325" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#0b0b0b">from any card</text>
</svg>
