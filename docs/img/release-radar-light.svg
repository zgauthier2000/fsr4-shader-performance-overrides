<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-label="Two radar charts with ten spokes each. Left: this release's lossy DLL, with the previous release's as a dashed outline. Right: AMD's FSR 4.1.1, with this release's lossy DLL as a dashed outline. On every spoke the best of the three reaches the outer ring, so a larger shape is better. Still picture: accuracy (dB): FSR 4.1.1 44.33 dB, the lossy DLL of dll-2026-10-11.7 44.31 dB, the lossy DLL of dll-2026-10-12 44.26 dB. Moving background: accuracy (dB): FSR 4.1.1 49.27 dB, the lossy DLL of dll-2026-10-11.7 49.07 dB, the lossy DLL of dll-2026-10-12 49.00 dB. Areas a moving object has just uncovered: accuracy (dB): FSR 4.1.1 34.48 dB, the lossy DLL of dll-2026-10-11.7 36.48 dB, the lossy DLL of dll-2026-10-12 36.53 dB. Tiny fast sparks: share of their brightness shown (%): FSR 4.1.1 83%, the lossy DLL of dll-2026-10-11.7 74%, the lossy DLL of dll-2026-10-12 74%. Leaves swaying without motion vectors: error (of 255): FSR 4.1.1 12.1, the lossy DLL of dll-2026-10-11.7 18.6, the lossy DLL of dll-2026-10-12 18.7. Leaves swaying at half that speed: error (of 255): FSR 4.1.1 10.2, the lossy DLL of dll-2026-10-11.7 13.5, the lossy DLL of dll-2026-10-12 12.0. Still picture with grain of 6 of 255: change per frame (of 255): FSR 4.1.1 0.785, the lossy DLL of dll-2026-10-11.7 0.342, the lossy DLL of dll-2026-10-12 0.460. Thin wire under a slow pan: change per frame (of 255): FSR 4.1.1 7.2, the lossy DLL of dll-2026-10-11.7 9.6, the lossy DLL of dll-2026-10-12 10.3. Still picture: change per frame (of 255): FSR 4.1.1 0.037, the lossy DLL of dll-2026-10-11.7 0.024, the lossy DLL of dll-2026-10-12 0.024. Time per upscale call at 3840x2160 (ms): FSR 4.1.1 4.76 ms, the lossy DLL of dll-2026-10-11.7 2.36 ms, the lossy DLL of dll-2026-10-12 2.36 ms.">
