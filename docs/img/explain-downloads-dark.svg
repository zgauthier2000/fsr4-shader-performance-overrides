<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Four builds became two downloads. The builds for RX 7000 and for RX 6000 are now one download, fsr4.1.1-cyboman.zip. The compact RX 6000 build and the integrated-graphics build are now one, fsr4.1.1-igpu-cyboman.zip. Each download holds an exact DLL, with the same picture as AMD's, and a lossy DLL, which is faster.">
<rect x="0.0" y="0.0" width="760.0" height="300.0" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">Four builds became two downloads</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">Pick by the name of your graphics chip. Each zip holds two DLLs.</text>
<text x="24.0" y="86.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">before: one file per kind of chip</text>
<text x="300.0" y="86.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">now</text>
<rect x="24.0" y="96.0" width="190.0" height="34.0" rx="4" fill="#262624" stroke="#2c2c2a" stroke-width="1.5"/>
<text x="36.0" y="118.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#ffffff">RX 7000</text>
<line x1="216.0" y1="113.0" x2="292.2" y2="134.9" stroke="#898781" stroke-width="1.5"/><polygon points="296.0,136.0 289.1,137.2 290.8,131.3" fill="#898781"/>
<rect x="24.0" y="142.0" width="190.0" height="34.0" rx="4" fill="#262624" stroke="#2c2c2a" stroke-width="1.5"/>
<text x="36.0" y="164.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#ffffff">RX 6000</text>
<line x1="216.0" y1="159.0" x2="292.2" y2="137.1" stroke="#898781" stroke-width="1.5"/><polygon points="296.0,136.0 290.8,140.7 289.1,134.8" fill="#898781"/>
<rect x="24.0" y="188.0" width="190.0" height="34.0" rx="4" fill="#262624" stroke="#2c2c2a" stroke-width="1.5"/>
<text x="36.0" y="210.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#ffffff">RX 6000, compact</text>
<line x1="216.0" y1="205.0" x2="292.2" y2="226.9" stroke="#898781" stroke-width="1.5"/><polygon points="296.0,228.0 289.1,229.2 290.8,223.3" fill="#898781"/>
<rect x="24.0" y="234.0" width="190.0" height="34.0" rx="4" fill="#262624" stroke="#2c2c2a" stroke-width="1.5"/>
<text x="36.0" y="256.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#ffffff">integrated graphics</text>
<line x1="216.0" y1="251.0" x2="292.2" y2="229.1" stroke="#898781" stroke-width="1.5"/><polygon points="296.0,228.0 290.8,232.7 289.1,226.8" fill="#898781"/>
<rect x="300.0" y="96.0" width="436.0" height="80.0" rx="6" fill="#262624" stroke="#2c2c2a" stroke-width="1.5"/>
<text x="314.0" y="120.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#ffffff">fsr4.1.1-cyboman.zip</text>
<text x="314.0" y="140.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#ffffff">Radeon RX 7000 and RX 6000</text>
<text x="314.0" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#c3c2b7">the name has "RX" and four digits</text>
<rect x="586.0" y="108.0" width="138.0" height="24.0" rx="4" fill="#3987e5"/>
<text x="655.0" y="124.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">exact: same picture</text>
<rect x="586.0" y="140.0" width="138.0" height="24.0" rx="4" fill="#d95926"/>
<text x="655.0" y="156.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">lossy: faster</text>
<rect x="300.0" y="188.0" width="436.0" height="80.0" rx="6" fill="#262624" stroke="#2c2c2a" stroke-width="1.5"/>
<text x="314.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#ffffff">fsr4.1.1-igpu-cyboman.zip</text>
<text x="314.0" y="232.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#ffffff">graphics built into the processor</text>
<text x="314.0" y="250.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#c3c2b7">most laptops, mini PCs, handhelds</text>
<rect x="586.0" y="200.0" width="138.0" height="24.0" rx="4" fill="#3987e5"/>
<text x="655.0" y="216.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">exact: same picture</text>
<rect x="586.0" y="232.0" width="138.0" height="24.0" rx="4" fill="#d95926"/>
<text x="655.0" y="248.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">lossy: faster</text>
<text x="24.0" y="288.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Radeon RX 9000: neither. Those cards run a different FSR 4.</text>
</svg>
