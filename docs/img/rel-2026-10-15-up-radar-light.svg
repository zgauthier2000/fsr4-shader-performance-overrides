<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-label="ULTRA PERFORMANCE ONLY, not representative of the lossy DLL in other modes. Two radar charts with eleven spokes each, from release dll-2026-10-15 in Ultra Performance. Left: the lossy DLL, with the exact DLL as a dashed outline. Right: the exact DLL (AMD's picture), with the lossy DLL as a dashed outline. On every spoke the better of the two reaches the outer ring. Just uncovered, 1440p, moving: accuracy (dB): the exact DLL (AMD's picture) 36.2 dB, the lossy DLL 27.9 dB. Just uncovered, 5K, moving: accuracy (dB): the exact DLL (AMD's picture) 35.7 dB, the lossy DLL 31.7 dB. Moving background, 1440p: accuracy (dB): the exact DLL (AMD's picture) 43.3 dB, the lossy DLL 43.0 dB. Railing, 1440p, moving: accuracy (dB): the exact DLL (AMD's picture) 34.2 dB, the lossy DLL 34.0 dB. Old image beside moving objects, seven scenes, mean: error (of 255): the exact DLL (AMD's picture) 5.49, the lossy DLL 4.56. Tiny fast sparks, camera still: share of their brightness shown (%): the exact DLL (AMD's picture) 69%, the lossy DLL 48%. Thin wire, camera still: change per frame (of 255): the exact DLL (AMD's picture) 1.13, the lossy DLL 1.38. Thin wire in a fast pan: brightness shown, share of the true one (%): the exact DLL (AMD's picture) 87%, the lossy DLL 66%. Isolated bright dots (sky through leaves) per thousand dark pixels (): the exact DLL (AMD's picture) 0.36, the lossy DLL 2.12. Still picture with grain of 6, 10 and 15 of 255, mean: change per frame (of 255): the exact DLL (AMD's picture) 1.68, the lossy DLL 1.96. Time per upscale call, mean of 1080p, 1440p and 4K output (ms): the exact DLL (AMD's picture) 1.79 ms, the lossy DLL 1.47 ms.">
