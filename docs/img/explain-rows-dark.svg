<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Two changes inside the Windows DLLs. Left: AMD's shader writes its output pixels in a scattered order, which is slow on Radeon chips; the rewrite collects them and writes row after row. Right: the previous DLL still carried the code the rewrites had replaced, for example 45 exchanges between threads in one shader where 13 are used; this release removes it.">
<rect x="0.0" y="0.0" width="760.0" height="330.0" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">Two changes inside the Windows DLLs</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">Neither changes the picture. Whether they make Windows faster is what the timing kit is meant to find out.</text>
