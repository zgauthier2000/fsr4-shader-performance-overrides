<text x="24.0" y="300.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Measured so far (one RX 7800 XT, Linux with Proton): the last pass alone is faster (0.42 to 0.30 ms at 1440p); the whole</text>
<text x="24.0" y="316.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">upscaler is the same as before, because that driver already discarded the leftover code. Windows: not measured yet.</text>
