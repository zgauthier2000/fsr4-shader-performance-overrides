<svg xmlns="http://www.w3.org/2000/svg" width="760" height="506" viewBox="0 0 760 506" role="img" aria-label="6 parts being worked on, each with what would help: Lite speed: Timing kit reports: RX 7000 on Windows; A cleaner Lite (early): Games and scenes where AMD&#x27;s Lite looks wrong; Exact builds: Timing kit reports: GeForce, Arc and RX 5000; Small and handheld chips: Timing kit reports: handhelds and built-in graphics; Lossy picture quality: Games and scenes where a lossy build looks wrong; Tiled lossy (experiment only): Timing kit reports: RX 6000 cards">
