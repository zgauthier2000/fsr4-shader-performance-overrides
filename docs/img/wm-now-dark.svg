<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="5 parts being worked on, each with what would help: Faster lossy builds: Timing kit reports: Radeon on Windows, GeForce; Speed from AMD&#x27;s SDK: Timing kit reports: handhelds, built-in Radeon; A Vulkan version (early): Names of Vulkan games with FSR 4; A cleaner Lite (early): Games and scenes where AMD&#x27;s Lite looks wrong; Tiled lossy (experiment only): Timing kit reports: GeForce GTX 16 / RTX 20">
