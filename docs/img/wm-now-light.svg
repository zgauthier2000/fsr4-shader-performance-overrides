<text x="38" y="166" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#52514e">More speed, picture still AMD's, byte for byte</text>
<line x1="324" y1="151" x2="463" y2="151" stroke="#898781" stroke-width="1.5"/><polygon points="470,151 463,148 463,154" fill="#898781"/>
<text x="397" y="143" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#898781">new speedups in the kit</text>
<rect x="470" y="120" width="266" height="62" rx="8" fill="#e3eefb" stroke="#2a78d6"/>
<text x="484" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Timing kit reports: RX 7600 and</text>
<text x="484" y="165" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Steam Machine</text>
