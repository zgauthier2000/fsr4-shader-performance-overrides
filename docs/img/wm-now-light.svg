<rect x="470" y="120" width="266" height="62" rx="8" fill="#e3eefb" stroke="#2a78d6"/>
<text x="484" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Games and scenes where AMD's Lite</text>
<text x="484" y="165" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">looks wrong</text>
