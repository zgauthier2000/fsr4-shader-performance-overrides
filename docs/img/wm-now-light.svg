<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Five parts being worked on, each with what would help: Tiled lossy (experiment only): Timing kit reports: RX 6000 cards; Exact builds: Timing kit reports: RX 7600 and Steam Machine; Small and handheld chips: Timing kit reports: handhelds and built-in graphics; Lossy picture quality: Games and scenes where a lossy build looks wrong; A cleaner Lite (early): Games and scenes where AMD&#x27;s Lite looks wrong">
<rect width="760" height="430" rx="8" fill="#fcfcfb"/>
<text x="24" y="32" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#898781">Working on</text>
<text x="470" y="32" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#898781">What would help</text>
<rect x="24" y="44" width="300" height="62" rx="8" fill="#f1f0ec" stroke="#c9c8c0"/>
<text x="38" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#0b0b0b">Tiled lossy (experiment only)</text>
<text x="38" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#52514e">Not how released lossy builds work</text>
<line x1="324" y1="75" x2="463" y2="75" stroke="#898781" stroke-width="1.5"/><polygon points="470,75 463,72 463,78" fill="#898781"/>
