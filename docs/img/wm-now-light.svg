<svg xmlns="http://www.w3.org/2000/svg" width="760" height="278" viewBox="0 0 760 278" role="img" aria-label="3 parts being worked on, each with what would help: Speed from AMD&#x27;s SDK: Timing kit reports: RX 7000 on Windows, handhelds; A cleaner Lite (early): Games and scenes where AMD&#x27;s Lite looks wrong; Tiled lossy (experiment only): Timing kit reports: RX 6000 cards">
<rect width="760" height="278" rx="8" fill="#fcfcfb"/>
