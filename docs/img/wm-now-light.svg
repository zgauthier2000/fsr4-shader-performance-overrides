<text x="38" y="166" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#52514e">Fixing weak spots of AMD's own FSR 4 Lite</text>
<line x1="324" y1="151" x2="463" y2="151" stroke="#898781" stroke-width="1.5"/><polygon points="470,151 463,148 463,154" fill="#898781"/>
