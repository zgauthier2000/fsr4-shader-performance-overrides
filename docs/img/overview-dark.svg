<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-label="Overview. Of FSR 4.1.1's fourteen main passes, twelve are rewritten with the same output: the prepass (10% less time), ten model passes (the same arithmetic in fewer steps; pass 11 takes 62% less time and reads 76% less memory) and the postpass (about 70% less time, 68% less memory read). On a Radeon RX 7800 XT at 4K the upscaler time goes from 4.16 to 3.05 ms per frame and the memory read per frame from 7,639 to 5,317 MB.">
<rect width="760" height="392" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">What this project changes in FSR 4.1.1</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">FSR 4's passes in the order they run each frame. Twelve of fourteen are rewritten; the image stays AMD's, byte for byte.</text>
<rect x="24.0" y="96" width="84.0" height="34" rx="4" fill="#3987e5"/>
<text x="66.0" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Prepass</text>
<rect x="114.0" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="133.4" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<rect x="158.8" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="178.2" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<rect x="203.7" y="96" width="38.8" height="34" rx="4" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="223.1" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c3c2b7">3</text>
<rect x="248.5" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="267.9" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
<rect x="293.3" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="312.8" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">5</text>
<rect x="338.2" y="96" width="38.8" height="34" rx="4" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="357.6" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c3c2b7">6</text>
<rect x="383.0" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="402.4" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">7</text>
<rect x="427.8" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="447.2" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">8</text>
<rect x="472.7" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="492.1" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">9</text>
<rect x="517.5" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="536.9" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">10</text>
<rect x="562.3" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="581.8" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">11</text>
<rect x="607.2" y="96" width="38.8" height="34" rx="4" fill="#3987e5"/>
<text x="626.6" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">12</text>
<rect x="652.0" y="96" width="84.0" height="34" rx="4" fill="#3987e5"/>
<text x="694.0" y="117.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Postpass</text>
<text x="380.0" y="88.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">the model: 12 passes</text>
<path d="M114.0,93 V90 H646.0 V93" fill="none" stroke="#383835" stroke-width="1"/>
<text x="24.0" y="152.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">Prepass</text>
<text x="24.0" y="170.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">each thread fetches its</text>
<text x="24.0" y="186.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">neighbours' inputs once</text>
<text x="24.0" y="204.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#ffffff">−10% time</text>
<text x="380.0" y="152.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Model passes</text>
<text x="380.0" y="170.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c3c2b7">same arithmetic in fewer steps;</text>
<text x="380.0" y="186.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c3c2b7">pass 11 stores its output in groups</text>
<text x="380.0" y="204.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">pass 11: −62% time, −76% memory read</text>
<text x="736.0" y="152.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#ffffff">Postpass</text>
<text x="736.0" y="170.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#c3c2b7">writes its output in phases</text>
<text x="736.0" y="186.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#c3c2b7">instead of scattered stores</text>
<text x="736.0" y="204.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#ffffff">about −70% time, −68% memory read</text>
<rect x="24" y="230" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="42.0" y="240.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">rewritten, same output</text>
<rect x="194" y="230" width="12" height="12" rx="2" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="212.0" y="240.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">AMD's shader, untouched</text>
<line x1="24" y1="260" x2="736" y2="260" stroke="#2c2c2a" stroke-width="1"/>
<text x="24.0" y="288.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#ffffff">Upscaler time per frame</text>
<text x="360.0" y="288.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#ffffff">27% less</text>
<text x="24.0" y="306.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Shadow of the Tomb Raider, 4K Balanced, RX 7800 XT</text>
<text x="110.0" y="334.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#ffffff">AMD's shaders</text>
<path d="M120,322 H236.0 Q240.0,322 240.0,326 V334 Q240.0,338 236.0,338 H120 Z" fill="#4a4a46"/>
<text x="248.0" y="334.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">4.16 ms  ·  97 FPS</text>
<text x="110.0" y="362.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#ffffff">This project</text>
<path d="M120,350 H204.0 Q208.0,350 208.0,354 V362 Q208.0,366 204.0,366 H120 Z" fill="#3987e5"/>
