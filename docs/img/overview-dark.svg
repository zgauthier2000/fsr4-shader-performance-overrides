<text x="486.0" y="362.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#ffffff">This project</text>
<path d="M496,350 H575.5 Q579.5,350 579.5,354 V362 Q579.5,366 575.5,366 H496 Z" fill="#3987e5"/>
<text x="587.5" y="362.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">5,317 MB</text>
</svg>
