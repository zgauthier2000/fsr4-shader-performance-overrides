<text x="400.0" y="288.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#ffffff">Memory read per frame</text>
<text x="736.0" y="288.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#ffffff">30% less</text>
<text x="400.0" y="306.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">All of FSR 4 at 4K, RX 7800 XT</text>
