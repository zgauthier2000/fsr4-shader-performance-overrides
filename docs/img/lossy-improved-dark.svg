<text x="285.0" y="274.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">25%</text>
<line x1="370.0" y1="92" x2="370.0" y2="258" stroke="#2c2c2a" stroke-width="1"/>
<text x="370.0" y="274.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">50%</text>
<line x1="455.0" y1="92" x2="455.0" y2="258" stroke="#2c2c2a" stroke-width="1"/>
<text x="455.0" y="274.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">75%</text>
<line x1="540.0" y1="92" x2="540.0" y2="258" stroke="#2c2c2a" stroke-width="1"/>
<text x="540.0" y="274.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">100%</text>
<text x="24.0" y="126.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">Tiny, fast sparks</text>
