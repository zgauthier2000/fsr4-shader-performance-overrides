<text x="560.0" y="332.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#ffffff">0.25 dB  now</text>
<text x="24.0" y="360.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Test rig, 4K output, Balanced, camera still. The exact DLL is not shown: its picture is AMD's, byte for byte.</text>
