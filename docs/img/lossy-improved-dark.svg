<text x="736.0" y="232.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#c3c2b7">AMD's: 98%</text>
<line x1="533.2" y1="205" x2="533.2" y2="251" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3"/>
