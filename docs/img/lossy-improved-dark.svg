<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="What changed in the lossy DLL, measured in the test rig at 4K. Share of a particle drawn without motion vectors that is shown where it truly is, on the frames that skip the model: tiny, fast sparks, 16 percent in the previous release, 77 percent now, 83 percent with AMD's shaders; tiny, slow embers, 67 percent in the previous release, 77 percent now, 81 percent with AMD's shaders; larger particles, 70 percent in the previous release, 98 percent now, 98 percent with AMD's shaders; and how far a still picture is from AMD's: 0.71 dB in the previous release, 0.25 dB now.">
<rect width="760" height="372" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">The lossy DLL: what changed in this release</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">Particles and sparks that games draw without motion information: how much of each is shown</text>
<text x="24.0" y="70.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">where it really is, on the frames that skip the model (more is better). Gray: the previous release. Dashed line: AMD's shaders.</text>
<line x1="200.0" y1="92" x2="200.0" y2="258" stroke="#2c2c2a" stroke-width="1"/>
<text x="200.0" y="274.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#898781">0%</text>
