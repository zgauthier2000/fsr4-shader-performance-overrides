<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#52514e">FSR 4's neural network is about 60% of its work. The lossy DLL runs it on every other frame.</text>
