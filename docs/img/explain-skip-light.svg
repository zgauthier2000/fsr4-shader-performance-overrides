<text x="24.0" y="236.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#898781">Each box is one frame; the colored part is the time FSR 4 takes. 4K on an RX 7800 XT: about 3.0 ms with the network, about 1.3 ms without.</text>
