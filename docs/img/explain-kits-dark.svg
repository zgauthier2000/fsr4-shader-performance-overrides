<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-label="What the two timing kits measure. The Linux kit times each of FSR 4's fourteen passes on its own, with AMD's shaders and with the rewritten ones. The Windows kit times the whole upscaler in one piece, as a game runs it, with each DLL: AMD's shaders, the exact DLL and the lossy DLL, and checks that the exact DLL's picture is AMD's.">
<rect x="0.0" y="0.0" width="760.0" height="318.0" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#ffffff">What the two timing kits measure</text>
<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c3c2b7">Neither needs a game. Both show a summary at the end and ask before sending anything.</text>
<text x="24.0" y="96.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">Linux kit: every pass on its own</text>
