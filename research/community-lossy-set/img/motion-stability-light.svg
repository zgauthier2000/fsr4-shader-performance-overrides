<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" role="img" aria-label="Frame-to-frame change in the moving test scene with the community set, relative to AMD's shaders: background 175%, railing bars 125%, fine stripes 121%. This repository equals AMD at 100%.">
